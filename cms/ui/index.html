<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<title>CMS — Baú do Kira</title>
<style>
	:root {
		--bg: #121212; --panel: #181818; --border: #2a2a2a;
		--text: #e5e5e5; --muted: #9a9a9a; --accent: #8c5cf5;
		--danger: #f87171; --ok: #4ade80; --warn: #fbbf24;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text);
		font: 15px/1.5 ui-monospace, "Cascadia Mono", "Geist Mono", monospace; }
	header { display:flex; align-items:center; gap:1rem; padding:.8rem 1.2rem;
		border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5; }
	header h1 { font-size:1.05rem; margin:0; }
	header .sub { color: var(--muted); font-size:.8rem; }
	.spacer { flex:1; }
	#gitStatus { font-size:.75rem; color: var(--muted); }
	main { display:grid; grid-template-columns: 320px 1fr; gap:1rem; padding:1rem; align-items:start; }
	@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
	.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1rem; }
	h2 { font-size:.95rem; margin:0 0 .6rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
	label { display:block; font-size:.8rem; color:var(--muted); margin:.6rem 0 .2rem; }
	input[type=text], input[type=date], input[type=time], input[type=password],
	textarea, select { width:100%; background:#0e0e0e; color:var(--text); border:1px solid var(--border);
		border-radius:6px; padding:.5rem .6rem; font:inherit; }
	input:focus, textarea:focus { outline:1px solid var(--accent); }
	textarea { min-height:340px; resize:vertical; line-height:1.55; }
	.row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
	.row > * { flex:1; min-width:110px; }
	.check { display:flex; align-items:center; gap:.4rem; margin-top:.6rem; color:var(--text); font-size:.85rem; }
	button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.55rem .9rem;
		cursor:pointer; font:inherit; }
	button.secondary { background:#2a2a2a; color:var(--text); }
	button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
	button:disabled { opacity:.5; cursor:not-allowed; }
	#posts { list-style:none; margin:0; padding:0; }
	#posts li { padding:.45rem .6rem; border-radius:6px; cursor:pointer; display:flex;
		gap:.5rem; align-items:center; border:1px solid transparent; }
	#posts li:hover { background:#202020; }
	#posts li.active { background:#26212f; border-color:var(--accent); }
	.dot { width:8px; height:8px; border-radius:50%; flex:none; }
	.dot.draft { background:var(--warn); }
	.dot.pub { background:var(--ok); }
	#posts .slug { color:var(--muted); font-size:.72rem; }
	#msg { padding:.5rem .8rem; border-radius:6px; font-size:.8rem; display:none; margin:.4rem 0; }
	#msg.ok { display:block; background:#14331d; color:var(--ok); }
	#msg.err { display:block; background:#331414; color:var(--danger); }
	#msg.info { display:block; background:#1c2433; color:var(--ok); }
	#coverPreview { max-width:180px; margin-top:.4rem; border-radius:6px; display:none; border:1px solid var(--border); }
	.toolbar button { padding:.25rem .6rem; font-size:.8rem; margin-right:.3rem; background:#262626; }
	.tags-hint { font-size:.72rem; color:var(--muted); margin-top:.2rem; }
	.publish-note { font-size:.72rem; color:var(--muted); margin-top:.3rem; }
	.badge { font-size:.7rem; padding:.1rem .45rem; border-radius:20px; border:1px solid var(--border); color:var(--muted); }
</style>
</head>
<body>
<header>
	<h1>📝 CMS · Baú do Kira</h1>
	<span class="sub">gerador de posts .md para o Astro</span>
	<div class="spacer"></div>
	<div id="gitStatus"></div>
	<button class="secondary" id="tokenBtn" title="Definir token de acesso">🔑 Token</button>
</header>
<main>
	<section class="card">
		<h2>Postagens</h2>
		<ul id="posts"></ul>
		<button class="secondary" id="newPostBtn" style="width:100%;margin-top:.6rem">+ Nova postagem</button>
	</section>
	<section class="card">
		<div id="msg"></div>
		<form id="postForm" autocomplete="off">
			<input type="hidden" id="f-originalSlug" />
			<label for="f-title">Título *</label>
			<input type="text" id="f-title" required maxlength="200" placeholder="Título da postagem" />
			<div class="row">
				<div>
					<label for="f-slug">Slug (URL) — deixe vazio p/ automático</label>
					<input type="text" id="f-slug" placeholder="auto-gerado do título" />
				</div>
				<div>
					<label for="f-date">Data *</label>
					<input type="date" id="f-date" required />
				</div>
				<div>
					<label for="f-time">Horário</label>
					<input type="time" id="f-time" />
				</div>
			</div>
			<label for="f-description">Descrição (resumo) *</label>
			<input type="text" id="f-description" required maxlength="400" placeholder="Aparece na listagem do blog" />
			<label for="f-tags">Tags (separadas por vírgula)</label>
			<input type="text" id="f-tags" placeholder="guide, astro, tutorial" />
			<div class="tags-hint" id="tagsHint"></div>
			<label for="f-coverFile">Imagem de capa (opcional por enquanto — recomendada)</label>
			<input type="file" id="f-coverFile" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" />
			<img id="coverPreview" alt="Pré-visualização da capa" />
			<div class="check"><input type="checkbox" id="f-draft" checked /><label for="f-draft" style="margin:0">Rascunho (não publicar ainda)</label></div>
			<div class="check"><input type="checkbox" id="f-updated" /><label for="f-updated" style="margin:0">Marcar como atualizado (updatedAt = agora)</label></div>
			<label for="f-content">Conteúdo (Markdown) *</label>
			<div class="toolbar">
				<button type="button" data-md="## ">H2</button>
				<button type="button" data-md="### ">H3</button>
				<button type="button" data-wrap="**">negrito</button>
				<button type="button" data-wrap="`">código</button>
				<button type="button" data-link>link</button>
				<button type="button" id="imgBtn">🖼️ inserir imagem</button>
				<input type="file" id="f-imgFile" accept="image/*" style="display:none" />
			</div>
			<textarea id="f-content" required placeholder="Escreva aqui em Markdown…"></textarea>
			<div class="row" style="margin-top:.8rem">
				<button type="submit" id="saveBtn">💾 Salvar (gera .md no Astro)</button>
				<button type="button" class="secondary" id="publishBtn">🚀 Publicar no GitHub</button>
				<button type="button" class="danger" id="deleteBtn">Excluir</button>
			</div>
			<div class="publish-note" id="publishNote"></div>
		</form>
	</section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null; // { slug, post }
let pendingCover = null;

function token() { return localStorage.getItem("cms_token") || ""; }
function setMsg(text, kind) {
	const m = $("msg");
	m.textContent = text;
	m.className = kind || "info";
	m.style.display = "block";
}

async function api(path, opts = {}) {
	const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
	if (token()) headers.Authorization = "Bearer " + token();
	const res = await fetch(path, Object.assign({}, opts, { headers }));
	if (res.status === 401) {
		const t = prompt("Token de acesso (CMS_TOKEN):");
		if (t) { localStorage.setItem("cms_token", t); return api(path, opts); }
		throw new Error("Acesso negado - informe o token.");
	}
	const data = await res.json().catch(() => ({}));
	if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
	return data;
}

function readImageFile(file, maxDim = 1600) {
	return new Promise((resolve, reject) => {
		const img = new Image();
		const url = URL.createObjectURL(file);
		img.onload = () => {
			const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
			const canvas = document.createElement("canvas");
			canvas.width = Math.round(img.width * scale);
			canvas.height = Math.round(img.height * scale);
			canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
			URL.revokeObjectURL(url);
			resolve(canvas.toDataURL("image/webp", 0.85));
		};
		img.onerror = () => reject(new Error("Nao foi possivel ler a imagem."));
		img.src = url;
	});
}

// ---- Lista ----
async function refresh() {
	try {
		const [{ posts }, { tags }, git] = await Promise.all([
			api("/api/posts"), api("/api/tags"), api("/api/status"),
		]);
		renderPosts(posts);
		$("tagsHint").textContent = "Sugestoes: " + (tags.length ? tags.join(", ") : "(nenhuma ainda)");
		$("gitStatus").textContent = "branch " + git.branch + " · " + git.commitsAhead + " commit(s) a frente do origin";
	} catch (e) { setMsg(e.message, "err"); }
}

function escapeHtml(s) {
	return String(s ?? "").replace(/[&<>"']/g, (c) => ({
		"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
	}[c]));
}

function renderPosts(posts) {
	const ul = $("posts");
	ul.innerHTML = "";
	if (!posts.length) {
		const li = document.createElement("li");
		li.textContent = "Nenhuma postagem ainda.";
		li.style.color = "var(--muted)";
		ul.appendChild(li);
		return;
	}
	for (const p of posts) {
		const li = document.createElement("li");
		li.innerHTML =
			'<span class="dot ' + (p.draft ? "draft" : "pub") + '"></span>' +
			"<div><div>" + escapeHtml(p.title) + '</div><div class="slug">/' + p.slug + "</div></div>";
		li.onclick = () => openPost(p.slug);
		if (current && current.slug === p.slug) li.classList.add("active");
		ul.appendChild(li);
	}
}

// ---- Formulario ----
function resetForm() {
	current = null; pendingCover = null;
	$("postForm").reset();
	$("f-originalSlug").value = "";
	$("f-date").value = new Date().toISOString().slice(0, 10);
	$("f-time").value = "12:00";
	$("f-draft").checked = true;
	$("coverPreview").style.display = "none";
	$("coverPreview").removeAttribute("src");
	$("deleteBtn").style.display = "none";
	$("publishBtn").style.display = "none";
	$("publishNote").textContent = "";
	$("saveBtn").textContent = "Salvar (gera .md no Astro)";
	$("f-title").focus();
}

async function openPost(slug) {
	try {
		const { post } = await api("/api/posts/" + encodeURIComponent(slug));
		current = { slug, post };
		$("f-originalSlug").value = post.slug;
		$("f-title").value = post.title;
		$("f-description").value = post.description;
		const d = new Date(post.createdAt);
		$("f-date").value = d.toISOString().slice(0, 10);
		$("f-time").value = d.toTimeString().slice(0, 5);
		$("f-slug").value = post.slug;
		$("f-tags").value = (post.tags || []).join(", ");
		$("f-content").value = post.content || "";
		$("f-draft").checked = !!post.draft;
		$("f-updated").checked = false;
		pendingCover = null;
		showCover(post.cover);
		$("deleteBtn").style.display = "";
		$("publishBtn").style.display = "";
		$("saveBtn").textContent = "Salvar alteracoes";
		refresh();
	} catch (e) { setMsg(e.message, "err"); }
}

function showCover(cover) {
	const img = $("coverPreview");
	if (cover && cover.startsWith("../assets/")) {
		img.src = "/api/assets/" + encodeURIComponent(cover.replace("../assets/", ""));
		img.style.display = "block";
	} else { img.style.display = "none"; img.removeAttribute("src"); }
}

function collectPayload() {
	const date = $("f-date").value;
	if (!date) throw new Error("Informe a data.");
	return {
		title: $("f-title").value,
		slug: $("f-slug").value,
		description: $("f-description").value,
		date: date,
		time: $("f-time").value,
		tags: $("f-tags").value.split(",").map((t) => t.trim()).filter(Boolean),
		draft: $("f-draft").checked,
		touchUpdated: $("f-updated").checked,
		content: $("f-content").value,
		...(pendingCover ? { coverData: pendingCover } : {}),
		...(!pendingCover && current && current.post.cover ? { cover: current.post.cover } : {}),
	};
}


async function save() {
	try {
		const payload = collectPayload();
		$("saveBtn").disabled = true;
		const { post, addedTags } = current
			? await api("/api/posts/" + encodeURIComponent(current.slug), { method: "PUT", body: JSON.stringify(payload) })
			: await api("/api/posts", { method: "POST", body: JSON.stringify(payload) });
		pendingCover = null;
		current = { slug: post.slug, post };
		$("f-originalSlug").value = post.slug;
		$("f-slug").value = post.slug;
		$("publishBtn").style.display = "";
		$("deleteBtn").style.display = "";
		setMsg("Salvo! Arquivo src/content/posts/" + post.slug + ".md gerado" +
			(addedTags && addedTags.length ? " · tags novas: " + addedTags.join(", ") : "") + ".", "ok");
		await refresh();
	} catch (e) { setMsg(e.message, "err"); } finally { $("saveBtn").disabled = false; }
}

async function publish() {
	if (!current) return;
	try {
		$("publishBtn").disabled = true;
		const r = await api("/api/posts/" + encodeURIComponent(current.slug) + "/publish", { method: "POST" });
		const msg = r.published.committed
			? (r.published.pushed ? "Commit + push OK - deploy automatico iniciado!" : "Commit local OK. Faca o push quando quiser (CMS_AUTO_PUSH=0).")
			: "Nada novo para commitar (post ja estava publicado).";
		setMsg(msg, "ok");
		await refresh();
	} catch (e) { setMsg(e.message, "err"); } finally { $("publishBtn").disabled = false; }
}

async function remove() {
	if (!current) return;
	if (!confirm("Excluir a postagem '" + current.post.title + "'? O arquivo .md sera removido.")) return;
	try {
		await api("/api/posts/" + encodeURIComponent(current.slug), { method: "DELETE" });
		resetForm();
		setMsg("Postagem excluida.", "ok");
		await refresh();
	} catch (e) { setMsg(e.message, "err"); }
}

// ---- Conteudo / toolbar / imagens ----
function insertAtCursor(ta, text) {
	const s = ta.selectionStart, e = ta.selectionEnd;
	ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
	ta.selectionStart = ta.selectionEnd = s + text.length;
	ta.focus();
}
function wrapSelection(ta, before, after) {
	const s = ta.selectionStart, e = ta.selectionEnd;
	const sel = ta.value.slice(s, e) || "texto";
	ta.value = ta.value.slice(0, s) + before + sel + after + ta.value.slice(e);
	ta.selectionStart = s + before.length;
	ta.selectionEnd = s + before.length + sel.length;
	ta.focus();
}

document.querySelectorAll(".toolbar [data-md]").forEach((b) =>
	b.onclick = () => insertAtCursor($("f-content"), b.dataset.md));
document.querySelectorAll(".toolbar [data-wrap]").forEach((b) =>
	b.onclick = () => wrapSelection($("f-content"), b.dataset.wrap, b.dataset.wrap));
document.querySelector(".toolbar [data-link]").onclick = () =>
	wrapSelection($("f-content"), "[texto](https://", ")");

$("f-coverFile").addEventListener("change", async (e) => {
	const file = e.target.files[0];
	if (!file) return;
	try {
		pendingCover = await readImageFile(file, 1600);
		const img = $("coverPreview");
		img.src = pendingCover;
		img.style.display = "block";
	} catch (err) { setMsg(err.message, "err"); }
	e.target.value = "";
});

$("imgBtn").onclick = () => $("f-imgFile").click();
$("f-imgFile").addEventListener("change", async (e) => {
	const file = e.target.files[0];
	if (!file) return;
	try {
		const dataUrl = await readImageFile(file, 1800);
		const r = await api("/api/images", { method: "POST", body: JSON.stringify({ data: dataUrl, alt: file.name.replace(/\.[^.]+$/, "") }) });
		insertAtCursor($("f-content"), "\n" + r.embed + "\n");
		setMsg("Imagem enviada para assets/ e inserida no conteudo.", "ok");
		refresh();
	} catch (err) { setMsg(err.message, "err"); }
	e.target.value = "";
});

// ---- Eventos globais ----
$("postForm").addEventListener("submit", (e) => { e.preventDefault(); save(); });
$("publishBtn").onclick = publish;
$("deleteBtn").onclick = remove;
$("newPostBtn").onclick = () => { resetForm(); refresh(); };
$("tokenBtn").onclick = () => {
	const t = prompt("Token de acesso (deixe vazio para remover):", token());
	if (t !== null) { localStorage.setItem("cms_token", t); setMsg(t ? "Token salvo." : "Token removido.", "ok"); }
};
$("f-slug").addEventListener("input", () => { $("f-slug").dataset.manual = "1"; });
$("f-title").addEventListener("input", () => { if (!$("f-slug").dataset.manual) $("f-slug").value = ""; });

resetForm();
refresh();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width" />
<title>CMS — Baú do Kira</title>
<style>
	:root {
		--bg: #121212; --panel: #181818; --border: #2a2a2a;
		--text: #e5e5e5; --muted: #9a9a9a; --accent: #8c5cf5;
		--danger: #f87171; --ok: #4ade80; --warn: #fbbf24;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--text);
		font: 15px/1.5 ui-monospace, "Cascadia Mono", "Geist Mono", monospace; }
	header { display:flex; align-items:center; gap:1rem; padding:.8rem 1.2rem;
		border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5; }
	header h1 { font-size:1.05rem; margin:0; }
	header .sub { color: var(--muted); font-size:.8rem; }
	.spacer { flex:1; }
	#gitStatus { font-size:.75rem; color: var(--muted); }
	main { display:grid; grid-template-columns: 320px 1fr; gap:1rem; padding:1rem; align-items:start; }
	@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
	.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1rem; }
	h2 { font-size:.95rem; margin:0 0 .6rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
	label { display:block; font-size:.8rem; color:var(--muted); margin:.6rem 0 .2rem; }
	input[type=text], input[type=date], input[type=time], input[type=password],
	textarea, select { width:100%; background:#0e0e0e; color:var(--text); border:1px solid var(--border);
		border-radius:6px; padding:.5rem .6rem; font:inherit; }
	input:focus, textarea:focus { outline:1px solid var(--accent); }
	textarea { min-height:340px; resize:vertical; line-height:1.55; }
	.row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
	.row > * { flex:1; min-width:110px; }
	.check { display:flex; align-items:center; gap:.4rem; margin-top:.6rem; color:var(--text); font-size:.85rem; }
	button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.55rem .9rem;
		cursor:pointer; font:inherit; }
	button.secondary { background:#2a2a2a; color:var(--text); }
	button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
	button:disabled { opacity:.5; cursor:not-allowed; }
	#posts { list-style:none; margin:0; padding:0; }
	#posts li { padding:.45rem .6rem; border-radius:6px; cursor:pointer; display:flex;
		gap:.5rem; align-items:center; border:1px solid transparent; }
	#posts li:hover { background:#202020; }
	#posts li.active { background:#26212f; border-color:var(--accent); }
	.dot { width:8px; height:8px; border-radius:50%; flex:none; }
	.dot.draft { background:var(--warn); }
	.dot.pub { background:var(--ok); }
	#posts .slug { color:var(--muted); font-size:.72rem; }
	#msg { padding:.5rem .8rem; border-radius:6px; font-size:.8rem; display:none; margin:.4rem 0; }
	#msg.ok { display:block; background:#14331d; color:var(--ok); }
	#msg.err { display:block; background:#331414; color:var(--danger); }
	#msg.info { display:block; background:#1c2433; color:var(--ok); }
	#coverPreview { max-width:180px; margin-top:.4rem; border-radius:6px; display:none; border:1px solid var(--border); }
	.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem .5rem; }
	.toolbar .tb-label { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
	.toolbar .tb-sep { width:1px; height:1.2em; background:var(--border); }
	.toolbar button { padding:.22rem .6rem; font-size:.78rem; background:#262626; }
	.toolbar button:hover { background:#333; }
	.toolbar button b, .toolbar button i, .toolbar button s { font-style:normal; color:inherit; }
	.emoji-picker { position: relative; margin-top:.45rem; }
	.emoji-picker .emoji-grid {
		position:absolute; left:0; top:calc(100% + 4px); z-index:20;
		width:min(480px, 92vw); max-height:200px; overflow:auto;
		background:#0e0e0e; border:1px solid var(--border); border-radius:8px;
		padding:.45rem; display:grid; grid-template-columns:repeat(auto-fill,minmax(2.1rem,1fr));
		gap:.1rem .15rem;
	}
	/* O atributo hidden precisa vencer o display:grid acima */
	.emoji-picker .emoji-grid[hidden] { display:none; }
	.emoji-picker .emoji-group {
		grid-column:1 / -1; font-size:.66rem; text-transform:uppercase;
		color:var(--muted); letter-spacing:.06em; margin:.25rem 0 .05rem;
	}
	.emoji-picker .emoji-btn {
		font-size:1.15rem; line-height:1; padding:.18rem; background:transparent;
		border:0; border-radius:6px; cursor:pointer;
	}
	.emoji-picker .emoji-btn:hover { background:#262626; }
	.tags-hint { font-size:.72rem; color:var(--muted); margin-top:.2rem; }
	.publish-note { font-size:.72rem; color:var(--muted); margin-top:.3rem; }
	.badge { font-size:.7rem; padding:.1rem .45rem; border-radius:20px; border:1px solid var(--border); color:var(--muted); }
</style>
</head>
<body>
<header>
	<h1>📝 CMS · Baú do Kira</h1>
	<span class="sub">gerador de posts .md para o Astro</span>
	<div class="spacer"></div>
	<div id="gitStatus"></div>
	<button class="secondary" id="tokenBtn" title="Definir token de acesso">🔑 Token</button>
</header>
<main>
	<section class="card">
		<h2>Postagens</h2>
		<ul id="posts"></ul>
		<button class="secondary" id="newPostBtn" style="width:100%;margin-top:.6rem">+ Nova postagem</button>
			<button class="secondary" id="previewBtn" style="width:100%;margin-top:.4rem" disabled title="Crie/salve uma postagem para habilitar">👁️ Preview no blog</button>

	</section>
	<section class="card">
		<div id="msg"></div>
		<form id="postForm" autocomplete="off">
			<input type="hidden" id="f-originalSlug" />
			<label for="f-title">Título *</label>
			<input type="text" id="f-title" required maxlength="200" placeholder="Título da postagem" />
			<div class="row">
				<div>
					<label for="f-slug">Slug (URL) — deixe vazio p/ automático</label>
					<input type="text" id="f-slug" placeholder="auto-gerado do título" />
				</div>
				<div>
					<label for="f-date">Data *</label>
					<input type="date" id="f-date" required />
				</div>
				<div>
					<label for="f-time">Horário</label>
					<input type="time" id="f-time" />
				</div>
			</div>
			<label for="f-description">Descrição (resumo) *</label>
			<input type="text" id="f-description" required maxlength="400" placeholder="Aparece na listagem do blog" />
			<label for="f-tags">Tags (separadas por vírgula)</label>
			<input type="text" id="f-tags" placeholder="guide, astro, tutorial" />
			<div class="tags-hint" id="tagsHint"></div>
			<label for="f-coverFile">Imagem de capa (opcional por enquanto — recomendada)</label>
			<input type="file" id="f-coverFile" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" />
			<img id="coverPreview" alt="Pré-visualização da capa" />
			<div class="check"><input type="checkbox" id="f-draft" checked /><label for="f-draft" style="margin:0">Rascunho (não publicar ainda)</label></div>
			<div class="check"><input type="checkbox" id="f-updated" /><label for="f-updated" style="margin:0">Marcar como atualizado (updatedAt = agora)</label></div>
			<label for="f-content">Conteúdo (Markdown) *</label>
			<div class="emoji-picker">
				<button type="button" class="secondary" id="emojiToggle" aria-expanded="false">😊 Emojis</button>
				<div class="emoji-grid" id="emojiGrid" hidden></div>
			</div>
			<div class="toolbar" role="toolbar" aria-label="Formatação Markdown">
				<span class="tb-label">Títulos</span>
				<button type="button" data-prefix="# " data-marker="#" title="Título 1 (H1)">H1</button>
				<button type="button" data-prefix="## " data-marker="##" title="Título 2 (H2)">H2</button>
				<button type="button" data-prefix="### " data-marker="###" title="Título 3 (H3)">H3</button>
				<button type="button" data-prefix="#### " data-marker="####" title="Título 4 (H4)">H4</button>
				<button type="button" data-prefix="##### " data-marker="#####" title="Título 5 (H5)">H5</button>
				<button type="button" data-prefix="###### " data-marker="######" title="Título 6 (H6)">H6</button>
				<span class="tb-sep"></span>
				<button type="button" data-wrap="**" title="Negrito (**negrito**)"><b>B</b></button>
				<button type="button" data-wrap="*" title="Itálico (*itálico*)"><i>I</i></button>
				<button type="button" data-wrap="~~" title="Riscado (~~texto~~)"><s>S</s></button>
				<button type="button" data-wrap="`" title="Código inline (`código`)">código</button>
				<button type="button" data-snippet="code" title="Bloco de código">bloco</button>
				<button type="button" data-snippet="link" title="Link">link</button>
				<button type="button" id="imgBtn" title="Inserir imagem do corpo do post">🖼️ imagem</button>
				<span class="tb-sep"></span>
				<button type="button" data-prefix="&gt; " data-marker="&gt;" title="Citação">citação</button>
				<button type="button" data-prefix="- " data-marker="-" title="Lista com marcadores">lista</button>
				<button type="button" data-prefix="1. " data-marker="1." title="Lista numerada">numerada</button>
				<button type="button" data-prefix="- [ ] " data-marker="- [ ]" title="Lista de tarefas">tarefas</button>
				<button type="button" data-snippet="hr" title="Linha horizontal">linha</button>
				<button type="button" data-snippet="table" title="Tabela">tabela</button>
				<input type="file" id="f-imgFile" accept="image/*" style="display:none" />
			</div>
			<textarea id="f-content" lang="pt-BR" spellcheck="true" required placeholder="Escreva aqui em Markdown…"></textarea>
			<div class="publish-note" id="saveState" style="margin-top:.4rem"></div>
			<div class="row" style="margin-top:.8rem">
				<button type="submit" id="saveBtn">💾 Salvar (gera .md no Astro)</button>
				<button type="button" class="secondary" id="publishBtn">🚀 Publicar no GitHub</button>
				<button type="button" class="danger" id="deleteBtn">Excluir</button>
			</div>
			<div class="publish-note" id="publishNote"></div>
		</form>
	</section>
</main>
<script src="/ui/app.js"></script>
</body>
</html>

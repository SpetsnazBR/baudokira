name: Criar GitHub Release

"on":
  push:
    tags:
      - "v*"

# Permissão mínima necessária para criar a GitHub Release
permissions:
  contents: write

# Impede releases simultâneas
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'SpetsnazBR/baudokira'
    runs-on: ubuntu-24.04
    steps:
      # Supply chain: ações fixadas por SHA completo (imutável)
      - name: Checkout (com histórico e tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Montar notas da release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "# ${TAG}"
            echo
            echo "## O que mudou"
            echo
            if [ -n "${PREV}" ]; then
              git log --no-merges --pretty=format:'- %s' "${PREV}..${TAG}"
            else
              git log --no-merges -40 --pretty=format:'- %s' "${TAG}"
            fi
            echo
          } > /tmp/release_body.md

      - name: Criar GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release_body.md
